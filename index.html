<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programme Timer</title>

<style>
  /* ============================================================
     SCREEN-ADAPTIVE LAYOUT

     All text sizes are calculated by the script at the bottom of
     this page from the real visible size of the screen (projector,
     laptop, iPad, phone, portrait or landscape):

       - the countdown is made as large as the screen allows
         (up to 36% of the screen height and 90% of its width)
       - all other text is then sized to fill the remaining space,
         shrinking automatically when a title or session name is long
       - sizes are recalculated whenever the window is resized,
         the device is rotated or full-screen mode is switched

     Colours are unchanged: they are set by the timing script.
     ============================================================ */

  html {
    /* Stop iPhone / iPad Safari enlarging text in landscape */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: manipulation;   /* no accidental double-tap zoom on iPad/phone */
  }

  body {
    background: #111827;
    color: white;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  /* Covers exactly the visible part of the screen. (On phones and
     tablets, "100vh" can extend behind the browser's toolbars.) */
  .screen {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 3vh 4vw 1.5vh;
    text-align: center;

    /* Starting sizes only: the script replaces all of these */
    --fs-message: 5vh;
    --fs-timer: 30vh;
    --fs-status: 5vh;
    --fs-label: 3vh;
    --fs-title: 6vh;
    --fs-presenter: 4.5vh;
    --fs-affil: 3vh;
    --fs-footer: 2.4vh;
  }

  /* Message, timer and presentation details, spread top-to-bottom */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .group {
    flex: 0 0 auto;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }

  .group-middle {
    position: relative;
  }

  /* Main message near the top */
  .message {
    font-size: var(--fs-message);
    font-weight: 600;
    line-height: 1.15;
  }

  /* Timer */
  .timer,
  .timer-probe {
    font-size: var(--fs-timer);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.04em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* Invisible copy of "00:00", used to measure the timer width */
  .timer-probe {
    position: absolute;
    top: 0;
    left: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* Text below the timer */
  .status-message {
    margin-top: 0.3em;
    font-size: var(--fs-status);
    font-weight: 600;
    line-height: 1.1;
  }

  /* Presentation title */
  .presentation {
    font-size: var(--fs-title);
    font-weight: 600;
    line-height: 1.15;
  }

  /* Presenter name */
  .presenter {
    margin-top: 0.3em;
    font-size: var(--fs-presenter);
    font-weight: 500;
    line-height: 1.15;
  }

  .affiliation {
    margin-top: 0.2em;
    font-size: var(--fs-affil);
    font-weight: 400;
    line-height: 1.2;
    opacity: 0.85;
  }

  .status-message:empty,
  .presentation:empty,
  .presenter:empty,
  .affiliation:empty {
    display: none;
  }

  /* Footer: programme start time (left) and current time (right) */
  .footer {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-top: 0.3em;
    font-size: var(--fs-footer);
    line-height: 1.2;
    white-space: nowrap;
  }

  .schedule-time {
    opacity: 0.7;
  }

  .current-time {
    opacity: 0.8;
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     SPECIAL INVITED SPEAKER PRESENTATION

     This changes only the typography and layout.
     It does not change any background or text colours.
     (Its larger text sizes are set in KEYNOTE_TEXT_SIZES
     in the script.)
     ============================================================ */

  .invited-speaker .presentation {
    font-weight: 700;
    line-height: 1.1;
  }

  .invited-speaker .presenter {
    font-weight: 700;
  }

  .invited-label {
    font-size: var(--fs-label);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.5em;
  }

  /* Ensure the invited label is hidden unless needed */
  .invited-label:empty {
    display: none;
  }
</style>
</head>

/* ============================================================

function timeToSeconds(time) {
  const [hours, minutes] = time.split(":").map(Number);
  return hours * 3600 + minutes * 60;
}


function formatTime(seconds) {
  seconds = Math.max(0, Math.ceil(seconds));

  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}


function getLondonTimeParts() {
  const now = new Date();

  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: TIME_ZONE,
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).formatToParts(now);

  const result = {};

  parts.forEach(part => {
    if (part.type !== "literal") {
      result[part.type] = Number(part.value);
    }
  });

  return result;
}


/* ============================================================
   TEXT SIZES - ADAPT TO THE SCREEN

   Each value is the LARGEST size a text may have, as a fraction
   of the screen height (h) and of the screen width (w). The
   smaller of the two is used, so the same settings work on a
   wide projector, a laptop, an iPad and a phone held upright.

   If everything does not fit (e.g. a very long title), all the
   text is reduced together until it fits. The countdown keeps
   its size unless the screen is extremely small.
   ============================================================ */

const TEXT_SIZES = {
  message:   { h: 0.060, w: 0.070 },  // session name at the top
  status:    { h: 0.055, w: 0.065 },  // Presentation / Questions / ...
  label:     { h: 0.036, w: 0.045 },  // KEYNOTE PRESENTATION label
  title:     { h: 0.075, w: 0.080 },  // presentation title
  presenter: { h: 0.055, w: 0.060 },  // presenter name
  affil:     { h: 0.036, w: 0.045 }   // affiliation
};

// Larger title and presenter for the keynote
const KEYNOTE_TEXT_SIZES = {
  title:     { h: 0.085, w: 0.090 },
  presenter: { h: 0.065, w: 0.070 },
  affil:     { h: 0.040, w: 0.050 }
};

// Countdown: up to 36% of the screen height and 90% of its width
const TIMER_MAX_HEIGHT = 0.36;
const TIMER_MAX_WIDTH = 0.90;

// Smallest reduction applied to the text before the countdown
// itself is also reduced (only happens on tiny screens)
const MIN_TEXT_SCALE = 0.45;


const screenEl = document.getElementById("screen");
const stageEl = document.getElementById("stage");
const groupTop = document.getElementById("groupTop");
const groupMiddle = document.getElementById("groupMiddle");
const groupBottom = document.getElementById("groupBottom");
const timerEl = document.getElementById("timer");
const timerProbe = document.getElementById("timerProbe");


function setSize(name, px) {
  screenEl.style.setProperty("--fs-" + name, px.toFixed(2) + "px");
}


function textWidth(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  return range.getBoundingClientRect().width;
}


function fitToScreen() {

  // Real visible area (excludes browser toolbars on phones/tablets)
  const W = screenEl.clientWidth;
  const H = screenEl.clientHeight;

  if (W < 40 || H < 40) return;

  // Margins around the screen edge
  screenEl.style.padding =
    Math.round(0.03 * H) + "px " +
    Math.round(0.04 * W) + "px " +
    Math.round(0.015 * H) + "px";

  // Footer: programme time and clock
  setSize("footer", Math.max(10, Math.min(0.026 * H, 0.034 * W)));

  // Largest size of each text for this screen
  const isKeynote = document.body.classList.contains("invited-speaker");
  const caps = {};

  Object.keys(TEXT_SIZES).forEach(key => {
    const r = (isKeynote && KEYNOTE_TEXT_SIZES[key]) || TEXT_SIZES[key];
    caps[key] = Math.min(r.h * H, r.w * W);
  });

  // Space left for message + timer + presentation details
  const stageW = stageEl.clientWidth;
  const stageH = stageEl.clientHeight;

  // Measure the countdown width at 100px, then scale it to the screen
  setSize("timer", 100);
  const timerWidthAt100 =
    Math.max(textWidth(timerProbe), textWidth(timerEl), 1);

  const timerMax = Math.min(
    TIMER_MAX_HEIGHT * H,
    TIMER_MAX_WIDTH * stageW * 100 / timerWidthAt100
  );

  // Minimum empty space kept between the three blocks
  const minGap = 0.025 * H;

  function apply(textScale, timerScale) {
    Object.keys(caps).forEach(key => setSize(key, caps[key] * textScale));
    setSize("timer", timerMax * timerScale);
  }

  function fits() {
    const bottom = groupBottom.offsetHeight;
    const used =
      groupTop.offsetHeight +
      groupMiddle.offsetHeight +
      bottom +
      (bottom > 0 ? 2 : 1) * minGap;

    return used <= stageH && stageEl.scrollWidth <= stageW + 1;
  }

  // 1) Everything at full size
  apply(1, 1);
  if (fits()) return;

  // 2) Reduce the text, keep the countdown at full size
  apply(MIN_TEXT_SCALE, 1);

  if (fits()) {
    let lo = MIN_TEXT_SCALE;
    let hi = 1;

    for (let i = 0; i < 12; i++) {
      const mid = (lo + hi) / 2;
      apply(mid, 1);
      if (fits()) lo = mid; else hi = mid;
    }

    apply(lo, 1);
    return;
  }

  // 3) Very small screen: reduce text and countdown together
  let lo = 0.05;
  let hi = 1;

  for (let i = 0; i < 14; i++) {
    const mid = (lo + hi) / 2;
    apply(MIN_TEXT_SCALE * mid, mid);
    if (fits()) lo = mid; else hi = mid;
  }

  apply(MIN_TEXT_SCALE * lo, lo);
}


// Re-fit only when something that affects the layout has changed
// (screen size, displayed text, keynote style).

let lastFitSignature = "";

function fitIfChanged(force) {
  const ids = [
    "message", "statusMessage", "invitedLabel",
    "presentation", "presenter", "affiliation"
  ];

  const parts = [
    screenEl.clientWidth,
    screenEl.clientHeight,
    document.body.className,
    timerEl.textContent.length
  ];

  ids.forEach(id => {
    const el = document.getElementById(id);
    parts.push(el.style.display + "|" + el.textContent);
  });

  const signature = parts.join("||");

  if (!force && signature === lastFitSignature) return;

  lastFitSignature = signature;
  fitToScreen();
}


/* ============================================================
   PRESENTATION STATE
   ============================================================ */

function getPresentationState(elapsedSeconds) {

  // GREEN 0:00 -> 8:00 (continuous presentation countdown)
  if (elapsedSeconds < GREEN_END) {
    return {
      background: GREEN,
      text: "#ffffff",
      countdown: RED_END - elapsedSeconds,
      message: "Presentation"
    };
  }

  // YELLOW 8:00 -> 9:00 (same countdown continues)
  if (elapsedSeconds < YELLOW_END) {
    return {
      background: YELLOW,
      text: "#111827",
      countdown: RED_END - elapsedSeconds,
      message: "Presentation"
    };
  }

  // RED 9:00 -> 10:00 (same countdown reaches zero at 10:00)
  if (elapsedSeconds < RED_END) {
    return {
      background: RED,
      text: "#ffffff",
      countdown: RED_END - elapsedSeconds,
      message: "Presentation"
    };
  }

  // BLACK / QUESTIONS 10:00 -> 12:00 (countdown resets to 2:00)
  if (elapsedSeconds < QUESTIONS_END) {
    return {
      background: BLACK,
      text: "#ffffff",
      countdown: QUESTIONS_DURATION - (elapsedSeconds - RED_END),
      message: "Questions"
    };
  }

  // GRAY / SPEAKER HAND-OVER 12:00 -> 13:00 (countdown resets to 1:00)
  return {
    background: GRAY,
    text: "#ffffff",
    countdown: HANDOVER_DURATION - (elapsedSeconds - QUESTIONS_END),
    message: "Speaker Hand-over"
  };
}


/* ============================================================
   FLASH TALK TIMING

   Flash talks are 2 minutes each with a continuous countdown.
   ============================================================ */

function getFlashState(elapsedSeconds) {
  const duration = 2 * 60;

  return {
    background: GREEN,
    text: "#ffffff",
    countdown: Math.max(0, duration - elapsedSeconds),
    message: "Flash Talk"
  };
}


/* ============================================================
   KEYNOTE TIMING

   Same colour progression as a normal presentation, with
   the final 3 minutes reserved for questions and hand-over:

   PRESENTATION COLOUR PHASES (37 minutes)
   GREEN   0:00 -> 29:36
   YELLOW  29:36 -> 33:18
   RED     33:18 -> 37:00

   QUESTIONS
   BLACK   37:00 -> 39:00 (2 minutes)

   SPEAKER HAND-OVER
   GRAY    39:00 -> 40:00 (1 minute)
   ============================================================ */

function getKeynoteState(elapsedSeconds) {
  const keynotePresentationEnd = 37 * 60;
  const greenEnd = 29 * 60 + 36;
  const yellowEnd = 33 * 60 + 18;
  const questionsEnd = 39 * 60;
  const keynoteEnd = KEYNOTE_DURATION;

  if (elapsedSeconds < greenEnd) {
    return {
      background: GREEN,
      text: "#ffffff",
      countdown: keynotePresentationEnd - elapsedSeconds,
      message: "Keynote Presentation"
    };
  }

  if (elapsedSeconds < yellowEnd) {
    return {
      background: YELLOW,
      text: "#111827",
      countdown: keynotePresentationEnd - elapsedSeconds,
      message: "Keynote Presentation"
    };
  }

  if (elapsedSeconds < keynotePresentationEnd) {
    return {
      background: RED,
      text: "#ffffff",
      countdown: keynotePresentationEnd - elapsedSeconds,
      message: "Keynote Presentation"
    };
  }

  if (elapsedSeconds < questionsEnd) {
    return {
      background: BLACK,
      text: "#ffffff",
      countdown: QUESTIONS_DURATION - (elapsedSeconds - keynotePresentationEnd),
      message: "Questions"
    };
  }

  return {
    background: GRAY,
    text: "#ffffff",
    countdown: Math.max(0, keynoteEnd - elapsedSeconds),
    message: "Speaker Hand-over"
  };
}


/* ============================================================
   RENDER
   ============================================================ */

function clearPresentationDetails() {
  ["presentation", "presenter", "affiliation"].forEach(id => {
    const el = document.getElementById(id);
    el.textContent = "";
    el.style.display = "";
  });

  const invitedLabel = document.getElementById("invitedLabel");
  invitedLabel.textContent = "";
  invitedLabel.style.display = "none";
}


function render() {

  const london = getLondonTimeParts();

  const currentSeconds =
    london.hour * 3600 +
    london.minute * 60 +
    london.second;

  // Current London time
  document.getElementById("currentTime").textContent =
    `${String(london.hour).padStart(2, "0")}:` +
    `${String(london.minute).padStart(2, "0")}:` +
    `${String(london.second).padStart(2, "0")}`;


  // Find current programme item
  let active = null;

  for (let i = 0; i < SCHEDULE.length; i++) {
    const start = timeToSeconds(SCHEDULE[i].time);
    const end = start + SCHEDULE[i].duration * 60;

    if (currentSeconds >= start && currentSeconds < end) {
      active = SCHEDULE[i];
      break;
    }
  }


  // Nothing scheduled
  if (!active) {
    document.body.style.backgroundColor = NORMAL_BACKGROUND;
    document.body.style.color = NORMAL_TEXT;
    document.body.classList.remove("invited-speaker");

    document.getElementById("message").textContent = "Programme";
    document.getElementById("timer").textContent = "--:--";

    clearPresentationDetails();

    document.getElementById("statusMessage").textContent = "";
    document.getElementById("scheduleTime").textContent = "";
    return;
  }


  const startSeconds = timeToSeconds(active.time);
  const elapsedSeconds = currentSeconds - startSeconds;

  // Programme start time
  document.getElementById("scheduleTime").textContent =
    `Programme: ${active.time}`;


  /* ==========================================================
     PRESENTATIONS AND INVITED SPEAKERS
     ========================================================== */

  if (
    active.type === "presentation" ||
    active.type === "flash" ||
    active.type === "keynote"
  ) {

    const state =
      active.type === "keynote"
        ? getKeynoteState(elapsedSeconds)
        : active.type === "flash"
          ? getFlashState(elapsedSeconds)
          : getPresentationState(elapsedSeconds);

    // Background colour: controlled exclusively by the timing state.
    document.body.style.backgroundColor = state.background;
    document.body.style.color = state.text;

    // Special invited-speaker layout (typography only).
    const isInvited = active.type === "keynote";
    document.body.classList.toggle("invited-speaker", isInvited);

    // Countdown
    document.getElementById("timer").textContent =
      formatTime(state.countdown);

    // Main message
    document.getElementById("message").textContent = active.message;

    // Invited speaker label
    const invitedLabel = document.getElementById("invitedLabel");
    invitedLabel.textContent = isInvited ? "Keynote Presentation" : "";

    // Presentation details
    document.getElementById("presentation").textContent = active.presentationName;
    document.getElementById("presenter").textContent = active.presenter;
    document.getElementById("affiliation").textContent = active.affiliation;

    // Status
    document.getElementById("statusMessage").textContent = state.message;

    // Hide presentation details during speaker hand-over.
    const isHandOver =
      (active.type === "presentation" && elapsedSeconds >= QUESTIONS_END) ||
      (active.type === "keynote" && elapsedSeconds >= 39 * 60);

    document.getElementById("presentation").style.display = isHandOver ? "none" : "";
    document.getElementById("presenter").style.display = isHandOver ? "none" : "";
    document.getElementById("affiliation").style.display = isHandOver ? "none" : "";
    invitedLabel.style.display = isHandOver ? "none" : (isInvited ? "" : "none");
  }


  /* ==========================================================
     BREAKS AND OTHER PROGRAMME ITEMS
     ========================================================== */

  else {
    document.body.style.backgroundColor = NORMAL_BACKGROUND;
    document.body.style.color = NORMAL_TEXT;
    document.body.classList.remove("invited-speaker");

    const remainingSeconds = active.duration * 60 - elapsedSeconds;

    document.getElementById("timer").textContent = formatTime(remainingSeconds);
    document.getElementById("message").textContent = active.message;

    clearPresentationDetails();

    document.getElementById("statusMessage").textContent = "";
  }
}


function update() {
  render();
  fitIfChanged(false);
}


/* ============================================================
   VALIDATION
   ============================================================ */

function validateSchedule() {

  if (GREEN_END >= YELLOW_END) {
    console.error("GREEN_END must be before YELLOW_END.");
  }

  if (YELLOW_END >= RED_END) {
    console.error("YELLOW_END must be before RED_END.");
  }

  if (RED_END >= QUESTIONS_END) {
    console.error("RED_END must be before QUESTIONS_END.");
  }

  if (QUESTIONS_END >= HANDOVER_END) {
    console.error("QUESTIONS_END must be before HANDOVER_END.");
  }

  if (HANDOVER_END > PRESENTATION_DURATION) {
    console.error("HANDOVER_END must not exceed PRESENTATION_DURATION.");
  }

  SCHEDULE.forEach(item => {

    if (!/^\d{2}:\d{2}$/.test(item.time)) {
      console.error("Invalid time:", item.time);
    }

    if (typeof item.duration !== "number" || item.duration <= 0) {
      console.error("Invalid duration:", item);
    }

    if (
      !["presentation", "keynote", "flash", "invited", "break", "other"]
        .includes(item.type)
    ) {
      console.error("Invalid type:", item);
    }

  });
}


/* ============================================================
   START
   ============================================================ */

validateSchedule();

update();

setInterval(update, 250);

// Re-fit when the screen changes: window resized, phone/tablet
// rotated, full-screen switched, or moved to the projector.
// (The 250 ms update also notices any size change.)
function refitSoon() {
  fitIfChanged(true);
  setTimeout(() => fitIfChanged(true), 300);
}

window.addEventListener("resize", refitSoon);
window.addEventListener("orientationchange", refitSoon);
document.addEventListener("fullscreenchange", refitSoon);

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", refitSoon);
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(refitSoon);
}

</script>
