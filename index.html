<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111827;
    color: white;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  .container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    box-sizing: border-box;
    padding: 6vh 4vw 3vh;
  }

  /* Main message near the top */
  .message {
    font-size: clamp(1.5rem, 4vw, 3rem);
    font-weight: 600;
    margin-bottom: 1vh;
  }

  /* Timer */
  .timer {
    font-size: clamp(6rem, 22vw, 16rem);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.04em;
    margin-top: 5vh;
  }

  /* Presentation information */
  .presentation-info {
    position: fixed;
    bottom: 8vh;
    left: 5vw;
    right: 5vw;
    text-align: center;
  }

  /* Presentation title */
  .presentation {
    max-width: 90%;
    margin: 0 auto;
    font-size: clamp(2.4rem, 5.5vw, 5rem);
    font-weight: 600;
    line-height: 1.15;
  }

  /* Presenter name */
  .presenter {
    margin-top: 1vh;
    font-size: clamp(1.8rem, 4vw, 3.2rem);
    font-weight: 500;
  }

  .affiliation {
    margin-top: 0.5vh;
    font-size: clamp(1rem, 2vw, 1.6rem);
    font-weight: 400;
    opacity: 0.85;
  }

  /* Text below the timer */
  .status-message {
    margin-top: 2vh;
    font-size: clamp(1.6rem, 3.5vw, 2.8rem);
    font-weight: 600;
  }

  .current-time {
    position: fixed;
    right: 2vw;
    bottom: 1.5vh;
    font-size: 1.1rem;
    opacity: 0.8;
  }

  .schedule-time {
    position: fixed;
    left: 2vw;
    bottom: 1.5vh;
    font-size: 0.9rem;
    opacity: 0.7;
  }
</style>
</head>

/* ============================================================
   HELPERS
   ============================================================ */

function timeToSeconds(time) {

  const [hours, minutes] =
    time.split(":").map(Number);

  return hours * 3600 + minutes * 60;
}


function formatTime(seconds) {

  seconds = Math.max(
    0,
    Math.ceil(seconds)
  );

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}


function getLondonTimeParts() {

  const now = new Date();

  const parts =
    new Intl.DateTimeFormat("en-GB", {

      timeZone: TIME_ZONE,

      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",

      hour12: false

    }).formatToParts(now);

  const result = {};

  parts.forEach(part => {

    if (part.type !== "literal") {

      result[part.type] =
        Number(part.value);

    }

  });

  return result;
}


/* ============================================================
   PRESENTATION STATE
   ============================================================ */

function getPresentationState(elapsedSeconds) {

  /*
     GREEN
     0:00 -> 8:30

     CONTINUOUS PRESENTATION COUNTDOWN
  */

  if (elapsedSeconds < GREEN_END) {

    return {

      background: GREEN,
      text: "#ffffff",

      countdown:
        RED_END - elapsedSeconds,

      message:
        "Presentation"

    };
  }


  /*
     YELLOW
     8:30 -> 10:00

     SAME COUNTDOWN CONTINUES
  */

  if (elapsedSeconds < YELLOW_END) {

    return {

      background: YELLOW,
      text: "#111827",

      countdown:
        RED_END - elapsedSeconds,

      message:
        "Presentation"

    };
  }


  /*
     RED
     10:00 -> 11:00

     SAME COUNTDOWN CONTINUES
     AND REACHES ZERO AT 11:00
  */

  if (elapsedSeconds < RED_END) {

    return {

      background: RED,
      text: "#ffffff",

      countdown:
        RED_END - elapsedSeconds,

      message:
        "Presentation"

    };
  }


  /*
     BLACK / QUESTIONS
     11:00 -> 12:30

     RESET COUNTDOWN TO 1:30
  */

  if (elapsedSeconds < QUESTIONS_END) {

    return {

      background: BLACK,
      text: "#ffffff",

      countdown:
        QUESTIONS_DURATION -
        (elapsedSeconds - RED_END),

      message:
        "Questions"

    };
  }


  /*
     GRAY / SPEAKER HAND-OVER
     12:30 -> 13:00

     RESET COUNTDOWN TO 0:30
  */

  return {

    background: GRAY,
    text: "#ffffff",

    countdown:
      HANDOVER_DURATION -
      (elapsedSeconds - QUESTIONS_END),

    message:
      "Speaker Hand-over"

  };
}


/* ============================================================
   UPDATE
   ============================================================ */

function update() {

  const london =
    getLondonTimeParts();


  const currentSeconds =
    london.hour * 3600 +
    london.minute * 60 +
    london.second;


  /*
     Current London time
  */

  document.getElementById(
    "currentTime"
  ).textContent =

    `${String(london.hour).padStart(2, "0")}:` +
    `${String(london.minute).padStart(2, "0")}:` +
    `${String(london.second).padStart(2, "0")}`;


  /*
     Find current programme item
  */

  let active = null;


  for (
    let i = 0;
    i < SCHEDULE.length;
    i++
  ) {

    const start =
      timeToSeconds(
        SCHEDULE[i].time
      );

    const end =
      start +
      SCHEDULE[i].duration * 60;


    if (
      currentSeconds >= start &&
      currentSeconds < end
    ) {

      active =
        SCHEDULE[i];

      break;
    }
  }


  /*
     Nothing scheduled
  */

  if (!active) {

    document.body.style.backgroundColor =
      NORMAL_BACKGROUND;

    document.body.style.color =
      NORMAL_TEXT;


    document.getElementById(
      "message"
    ).textContent =
      "Programme";


    document.getElementById(
      "timer"
    ).textContent =
      "--:--";


    document.getElementById("presentation").textContent = "";
    document.getElementById("presentation").style.display = "";


    document.getElementById("presenter").textContent = "";
    document.getElementById("presenter").style.display = "";


    document.getElementById("affiliation").textContent = "";
    document.getElementById("affiliation").style.display = "";


    document.getElementById(
      "statusMessage"
    ).textContent =
      "";

    return;
  }


  const startSeconds =
    timeToSeconds(active.time);


  const elapsedSeconds =
    currentSeconds -
    startSeconds;


  /*
     Programme start time
  */

  document.getElementById(
    "scheduleTime"
  ).textContent =
    `Programme: ${active.time}`;


  /* ==========================================================
     PRESENTATION
     ========================================================== */

  if (
    active.type === "presentation"
  ) {

    const state =
      getPresentationState(
        elapsedSeconds
      );


    /*
       Background colour
    */

    document.body.style.backgroundColor =
      state.background;

    document.body.style.color =
      state.text;


    /*
       Countdown
    */

    document.getElementById(
      "timer"
    ).textContent =
      formatTime(
        state.countdown
      );


    /*
       Main message
    */

    document.getElementById(
      "message"
    ).textContent =
      active.message;


    /*
       Presentation title
    */

    document.getElementById(
      "presentation"
    ).textContent =
      active.presentationName;


    /*
       Presenter
    */

    document.getElementById(
      "presenter"
    ).textContent =
      active.presenter;


    /*
       Affiliation
    */

    document.getElementById(
      "affiliation"
    ).textContent =
      active.affiliation;


    /*
       Status
    */

    document.getElementById(
      "statusMessage"
    ).textContent =
      state.message;

    // Hide presentation details during speaker hand-over.
    const isHandOver = elapsedSeconds >= QUESTIONS_END;
    document.getElementById("presentation").style.display =
      isHandOver ? "none" : "";
    document.getElementById("presenter").style.display =
      isHandOver ? "none" : "";
    document.getElementById("affiliation").style.display =
      isHandOver ? "none" : "";

  }


  /* ==========================================================
     BREAKS AND OTHER
     ========================================================== */

  else {

    document.body.style.backgroundColor =
      NORMAL_BACKGROUND;

    document.body.style.color =
      NORMAL_TEXT;


    const remainingSeconds =
      active.duration * 60 -
      elapsedSeconds;


    document.getElementById(
      "timer"
    ).textContent =
      formatTime(
        remainingSeconds
      );


    document.getElementById(
      "message"
    ).textContent =
      active.message;


    document.getElementById("presentation").textContent = "";
    document.getElementById("presentation").style.display = "";


    document.getElementById("presenter").textContent = "";
    document.getElementById("presenter").style.display = "";


    document.getElementById("affiliation").textContent = "";
    document.getElementById("affiliation").style.display = "";


    document.getElementById(
      "statusMessage"
    ).textContent =
      "";
  }
}


/* ============================================================
   VALIDATION
   ============================================================ */

function validateSchedule() {

  if (GREEN_END >= YELLOW_END) {

    console.error(
      "GREEN_END must be before YELLOW_END."
    );
  }


  if (YELLOW_END >= RED_END) {

    console.error(
      "YELLOW_END must be before RED_END."
    );
  }


  if (RED_END >= QUESTIONS_END) {

    console.error(
      "RED_END must be before QUESTIONS_END."
    );
  }


  if (QUESTIONS_END >= HANDOVER_END) {

    console.error(
      "QUESTIONS_END must be before HANDOVER_END."
    );
  }


  if (HANDOVER_END > PRESENTATION_DURATION) {

    console.error(
      "HANDOVER_END must not exceed PRESENTATION_DURATION."
    );
  }


  SCHEDULE.forEach(item => {

    if (!/^\d{2}:\d{2}$/.test(item.time)) {

      console.error(
        "Invalid time:",
        item.time
      );
    }


    if (
      typeof item.duration !== "number" ||
      item.duration <= 0
    ) {

      console.error(
        "Invalid duration:",
        item
      );
    }


    if (
      ![
        "presentation",
        "break",
        "other"
      ].includes(item.type)
    ) {

      console.error(
        "Invalid type:",
        item
      );
    }

  });
}


/* ============================================================

validateSchedule();

update();

setInterval(
  update,
  250
);
