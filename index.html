  }

    font-weight: 600;
    line-height: 1.15;

    font-size: clamp(1.8rem, 4vw, 3.2rem);
    font-weight: 500;

    margin-top: 0.5vh;
    font-size: clamp(1rem, 2vw, 1.6rem);
    font-weight: 400;
    opacity: 0.85;
  }

  .status-message {
    margin-top: 2vh;
    font-size: clamp(1.6rem, 3.5vw, 2.8rem);
    font-weight: 600;
  }

  .current-time {
    position: fixed;
    right: 2vw;
    bottom: 1.5vh;
    font-size: 1.1rem;
    opacity: 0.8;
  }

  .schedule-time {

    left: 2vw;
    bottom: 1.5vh;
    font-size: 0.9rem;

  }

     SPECIAL INVITED SPEAKER PRESENTATION

     It does not change any background or text colours.
     ============================================================ */

    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1.5vh;

  .invited-label:empty {
    display: none;

/* ============================================================
   HELPERS
   ============================================================ */

function timeToSeconds(time) {

  const [hours, minutes] =
    time.split(":").map(Number);

  return hours * 3600 + minutes * 60;
}


function formatTime(seconds) {

  seconds = Math.max(
    0,
    Math.ceil(seconds)
  );

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}


function getLondonTimeParts() {

  const now = new Date();

  const parts =
    new Intl.DateTimeFormat("en-GB", {

      timeZone: TIME_ZONE,

      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",

      hour12: false

    }).formatToParts(now);

  const result = {};

  parts.forEach(part => {

    if (part.type !== "literal") {

      result[part.type] =
        Number(part.value);

    }

  });

  return result;
}


/* ============================================================
   PRESENTATION STATE
   ============================================================ */

function getPresentationState(elapsedSeconds) {

  /*
     GREEN
     0:00 -> 8:00

     CONTINUOUS PRESENTATION COUNTDOWN
  */

  if (elapsedSeconds < GREEN_END) {

    return {

      background: GREEN,
      text: "#ffffff",

      countdown:
        RED_END - elapsedSeconds,

      message:
        "Presentation"

    };

  }


  /*
     YELLOW
     8:00 -> 9:00

     SAME COUNTDOWN CONTINUES
  */

  if (elapsedSeconds < YELLOW_END) {

    return {

      background: YELLOW,
      text: "#111827",

      countdown:
        RED_END - elapsedSeconds,

      message:
        "Presentation"

    };

  }


  /*
     RED
     9:00 -> 10:00

     SAME COUNTDOWN CONTINUES
     AND REACHES ZERO AT 10:00
  */

  if (elapsedSeconds < RED_END) {

    return {

      background: RED,
      text: "#ffffff",

      countdown:
        RED_END - elapsedSeconds,

      message:
        "Presentation"

    };

  }


  /*
     BLACK / QUESTIONS
     10:00 -> 12:00

     RESET COUNTDOWN TO 2:00
  */

  if (elapsedSeconds < QUESTIONS_END) {

    return {

      background: BLACK,
      text: "#ffffff",

      countdown:
        QUESTIONS_DURATION -
        (elapsedSeconds - RED_END),

      message:
        "Questions"

    };

  }


  /*
     GRAY / SPEAKER HAND-OVER
     12:00 -> 13:00

     RESET COUNTDOWN TO 1:00
  */

  return {

    background: GRAY,
    text: "#ffffff",

    countdown:
      HANDOVER_DURATION -
      (elapsedSeconds - QUESTIONS_END),

    message:
      "Speaker Hand-over"

  };

}


/* ============================================================
   FLASH TALK TIMING

   Flash talks are 2 minutes each with a continuous countdown.
   ============================================================ */

function getFlashState(elapsedSeconds) {
  const duration = 2 * 60;

  return {
    background: GREEN,
    text: "#ffffff",
    countdown: Math.max(0, duration - elapsedSeconds),
    message: "Flash Talk"
  };
}


/* ============================================================
   KEYNOTE TIMING

   Same colour progression as a normal presentation, with
   the final 3 minutes reserved for questions and hand-over:

   PRESENTATION COLOUR PHASES (37 minutes)
   GREEN   0:00 -> 29:36
   YELLOW  29:36 -> 33:18
   RED     33:18 -> 37:00

   QUESTIONS
   BLACK   37:00 -> 39:00 (2 minutes)

   SPEAKER HAND-OVER
   GRAY    39:00 -> 40:00 (1 minute)
   ============================================================ */

function getKeynoteState(elapsedSeconds) {
  // Keep the keynote at 40 minutes total:
  // 37 minutes presentation + 2 minutes questions + 1 minute hand-over.
  const keynotePresentationEnd = 37 * 60;
  const greenEnd = 29 * 60 + 36;
  const yellowEnd = 33 * 60 + 18;
  const questionsEnd = 39 * 60;
  const keynoteEnd = KEYNOTE_DURATION;

  if (elapsedSeconds < greenEnd) {
    return {
      background: GREEN,
      text: "#ffffff",
      countdown: keynotePresentationEnd - elapsedSeconds,
      message: "Keynote Presentation"
    };
  }

  if (elapsedSeconds < yellowEnd) {
    return {
      background: YELLOW,
      text: "#111827",
      countdown: keynotePresentationEnd - elapsedSeconds,
      message: "Keynote Presentation"
    };
  }

  if (elapsedSeconds < keynotePresentationEnd) {
    return {
      background: RED,
      text: "#ffffff",
      countdown: keynotePresentationEnd - elapsedSeconds,
      message: "Keynote Presentation"
    };
  }

  if (elapsedSeconds < questionsEnd) {
    return {
      background: BLACK,
      text: "#ffffff",
      countdown: QUESTIONS_DURATION - (elapsedSeconds - keynotePresentationEnd),
      message: "Questions"
    };
  }

  return {
    background: GRAY,
    text: "#ffffff",
    countdown: Math.max(0, keynoteEnd - elapsedSeconds),
    message: "Speaker Hand-over"
  };
}


/* ============================================================
   UPDATE
   ============================================================ */

function update() {

  const london =
    getLondonTimeParts();

  const currentSeconds =
    london.hour * 3600 +
    london.minute * 60 +
    london.second;


  /*
     Current London time
  */

  document.getElementById(
    "currentTime"
  ).textContent =

    `${String(london.hour).padStart(2, "0")}:` +
    `${String(london.minute).padStart(2, "0")}:` +
    `${String(london.second).padStart(2, "0")}`;


  /*
     Find current programme item
  */

  let active = null;

  for (
    let i = 0;
    i < SCHEDULE.length;
    i++
  ) {

    const start =
      timeToSeconds(
        SCHEDULE[i].time
      );

    const end =
      start +
      SCHEDULE[i].duration * 60;

    if (
      currentSeconds >= start &&
      currentSeconds < end
    ) {

      active =
        SCHEDULE[i];

      break;

    }

  }


  /*
     Nothing scheduled
  */

  if (!active) {

    document.body.style.backgroundColor =
      NORMAL_BACKGROUND;

    document.body.style.color =
      NORMAL_TEXT;

    // Remove any special invited-speaker layout.
    document.body.classList.remove("invited-speaker");

    document.getElementById(
      "message"
    ).textContent =
      "Programme";

    document.getElementById(
      "timer"
    ).textContent =
      "--:--";

    document.getElementById("presentation").textContent = "";
    document.getElementById("presentation").style.display = "";

    document.getElementById("presenter").textContent = "";
    document.getElementById("presenter").style.display = "";

    document.getElementById("affiliation").textContent = "";
    document.getElementById("affiliation").style.display = "";

    document.getElementById("invitedLabel").textContent = "";
    document.getElementById("invitedLabel").style.display = "none";

    document.getElementById(
      "statusMessage"
    ).textContent = "";

    document.getElementById(
      "scheduleTime"
    ).textContent = "";

    return;

  }


  const startSeconds =
    timeToSeconds(active.time);

  const elapsedSeconds =
    currentSeconds -
    startSeconds;


  /*
     Programme start time
  */

  document.getElementById(
    "scheduleTime"
  ).textContent =
    `Programme: ${active.time}`;


  /* ==========================================================
     PRESENTATIONS AND INVITED SPEAKERS
     ========================================================== */

  if (
    active.type === "presentation" ||
    active.type === "flash" ||
    active.type === "keynote"
  ) {

    const state =
      active.type === "keynote"
        ? getKeynoteState(elapsedSeconds)
        : active.type === "flash"
          ? getFlashState(elapsedSeconds)
          : getPresentationState(elapsedSeconds);


    /*
       Background colour

       This remains controlled exclusively by the
       existing presentation timing state.
    */

    document.body.style.backgroundColor =
      state.background;

    document.body.style.color =
      state.text;


    /*
       Apply special invited-speaker layout.

       This changes typography only.
       It does not change colours.
    */

    const isInvited =
      active.type === "keynote";

    document.body.classList.toggle(
      "invited-speaker",
      isInvited
    );


    /*
       Countdown
    */

    document.getElementById(
      "timer"
    ).textContent =
      formatTime(
        state.countdown
      );


    /*
       Main message
    */

    document.getElementById(
      "message"
    ).textContent =
      active.message;


    /*
       Invited speaker label
    */

    const invitedLabel =
      document.getElementById("invitedLabel");

    invitedLabel.textContent =
      isInvited ? "Keynote Presentation" : "";

    invitedLabel.style.display =
      isInvited ? "" : "none";


    /*
       Presentation title
    */

    document.getElementById(
      "presentation"
    ).textContent =
      active.presentationName;


    /*
       Presenter
    */

    document.getElementById(
      "presenter"
    ).textContent =
      active.presenter;


    /*
       Affiliation
    */

    document.getElementById(
      "affiliation"
    ).textContent =
      active.affiliation;


    /*
       Status
    */

    document.getElementById(
      "statusMessage"
    ).textContent =
      state.message;


    /*
       Hide presentation details during speaker hand-over.
    */

    const isHandOver =
      (active.type === "presentation" && elapsedSeconds >= QUESTIONS_END) ||
      (active.type === "keynote" && elapsedSeconds >= 39 * 60);

    document.getElementById("presentation").style.display =
      isHandOver ? "none" : "";

    document.getElementById("presenter").style.display =
      isHandOver ? "none" : "";

    document.getElementById("affiliation").style.display =
      isHandOver ? "none" : "";

    document.getElementById("invitedLabel").style.display =
      isHandOver ? "none" : (isInvited ? "" : "none");

  }


  /* ==========================================================
     BREAKS AND OTHER PROGRAMME ITEMS
     ========================================================== */

  else {

    document.body.style.backgroundColor =
      NORMAL_BACKGROUND;

    document.body.style.color =
      NORMAL_TEXT;

    // Remove the invited-speaker layout.
    document.body.classList.remove("invited-speaker");


    const remainingSeconds =
      active.duration * 60 -
      elapsedSeconds;


    /*
       Countdown
    */

    document.getElementById(
      "timer"
    ).textContent =
      formatTime(
        remainingSeconds
      );


    /*
       Main message
    */

    document.getElementById(
      "message"
    ).textContent =
      active.message;


    /*
       Clear presentation details
    */

    document.getElementById("presentation").textContent = "";
    document.getElementById("presentation").style.display = "";

    document.getElementById("presenter").textContent = "";
    document.getElementById("presenter").style.display = "";

    document.getElementById("affiliation").textContent = "";
    document.getElementById("affiliation").style.display = "";

    document.getElementById("invitedLabel").textContent = "";
    document.getElementById("invitedLabel").style.display = "none";


    /*
       Clear status
    */

    document.getElementById(
      "statusMessage"
    ).textContent = "";

  }

}


/* ============================================================
   VALIDATION
   ============================================================ */

function validateSchedule() {

  if (GREEN_END >= YELLOW_END) {

    console.error(
      "GREEN_END must be before YELLOW_END."
    );

  }

  if (YELLOW_END >= RED_END) {

    console.error(
      "YELLOW_END must be before RED_END."
    );

  }

  if (RED_END >= QUESTIONS_END) {

    console.error(
      "RED_END must be before QUESTIONS_END."
    );

  }

  if (QUESTIONS_END >= HANDOVER_END) {

    console.error(
      "QUESTIONS_END must be before HANDOVER_END."
    );

  }

  if (HANDOVER_END > PRESENTATION_DURATION) {

    console.error(
      "HANDOVER_END must not exceed PRESENTATION_DURATION."
    );

  }

  SCHEDULE.forEach(item => {

    if (!/^\d{2}:\d{2}$/.test(item.time)) {

      console.error(
        "Invalid time:",
        item.time
      );

    }

    if (
      typeof item.duration !== "number" ||
      item.duration <= 0
    ) {

      console.error(
        "Invalid duration:",
        item
      );

    }

    if (
      ![
        "presentation",
        "invited",
        "break",
        "other"
      ].includes(item.type)
    ) {

      console.error(
        "Invalid type:",
        item
      );

    }

  });

}


/* ============================================================
   START
   ============================================================ */

validateSchedule();

update();

setInterval(
  update,
  250
);

</script>
